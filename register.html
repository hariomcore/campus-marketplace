<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | Campus Marketplace</title>

    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f7f6fc;
            color: #111b3a;
        }

        button,
        input,
        select {
            font-family: inherit;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        .top-header {
            height: 78px;
            padding: 0 7.5%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background: #ffffff;
            border-bottom: 1px solid #e8e8ed;
        }


        /* LOGO */

        .logo {
            display: flex;
            align-items: center;
            gap: 11px;

            text-decoration: none;
            color: #111b3a;
        }

        .logo-icon {
            width: 47px;
            height: 47px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #6338df;
            border-radius: 10px;
        }

        .logo-icon svg {
            width: 27px;
            height: 27px;

            fill: none;
            stroke: white;
            stroke-width: 1.7;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .logo-text {
            font-size: 20px;
            line-height: 1.05;
            font-weight: 700;
        }

        .logo-text span {
            color: #6338df;
        }


        /* HOME BUTTON */

        .home-btn {
            height: 42px;
            padding: 0 17px;

            display: flex;
            align-items: center;
            gap: 8px;

            border: 1.5px solid #6338df;
            border-radius: 7px;

            background: white;
            color: #6338df;

            text-decoration: none;

            font-size: 13px;
            font-weight: 700;

            transition: 0.2s;
        }

        .home-btn:hover {
            background: #f4f0ff;
        }

        .home-btn svg {
            width: 17px;
            height: 17px;

            fill: none;
            stroke: #6338df;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }


        /* =====================================================
           MAIN
        ===================================================== */

        .page {
            min-height: calc(100vh - 78px);

            padding: 34px 20px 50px;

            display: flex;
            justify-content: center;
            align-items: flex-start;
        }


        /* =====================================================
           REGISTER CARD
        ===================================================== */

        .register-card {
            width: 100%;
            max-width: 820px;

            padding: 30px 30px 25px;

            background: white;

            border-radius: 15px;

            box-shadow:
                0 8px 30px rgba(30, 25, 70, 0.07);

            border: 1px solid #eeeeF3;
        }


        /* =====================================================
           HEADING
        ===================================================== */

        .heading {
            text-align: center;

            padding-bottom: 25px;

            border-bottom: 1px solid #eeeeee;

            margin-bottom: 24px;
        }

        .heading-icon {
            width: 58px;
            height: 58px;

            margin: 0 auto 13px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #6338df;
        }

        .heading-icon svg {
            width: 30px;
            height: 30px;

            fill: none;
            stroke: white;
            stroke-width: 1.7;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .heading h1 {
            font-size: 27px;
            margin-bottom: 7px;
        }

        .heading p {
            color: #737b8c;
            font-size: 13px;
        }


        /* =====================================================
           FORM
        ===================================================== */

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;

            margin-bottom: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 7px;

            color: #222c45;

            font-size: 13px;
            font-weight: 700;
        }

        .required {
            color: #d44848;
        }


        /* =====================================================
           INPUT ICON BOX
        ===================================================== */

        .input-icon-box {
            position: relative;
            width: 100%;
        }

        .input-icon-box svg {
            position: absolute;

            left: 13px;
            top: 50%;

            transform: translateY(-50%);

            width: 18px;
            height: 18px;

            fill: none;

            stroke: #7b8290;

            stroke-width: 1.6;

            stroke-linecap: round;
            stroke-linejoin: round;

            pointer-events: none;
        }

        .input-icon-box input {
            padding-left: 42px;
        }


        /* =====================================================
           INPUTS
        ===================================================== */

        input,
        select {
            width: 100%;
            height: 45px;

            padding: 0 12px;

            background: white;

            border: 1px solid #dcdfe6;

            border-radius: 7px;

            outline: none;

            color: #273149;

            font-size: 13px;

            transition: 0.2s;
        }

        input::placeholder {
            color: #9ba1ad;
        }

        input:focus,
        select:focus {
            border-color: #6338df;

            box-shadow:
                0 0 0 3px rgba(99, 56, 223, 0.08);
        }

        select {
            cursor: pointer;
        }


        /* =====================================================
           PASSWORD
        ===================================================== */

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-left: 42px;
            padding-right: 45px;
        }

        .password-lock {
            position: absolute;

            left: 13px;
            top: 50%;

            transform: translateY(-50%);

            width: 18px;
            height: 18px;

            fill: none;

            stroke: #7b8290;

            stroke-width: 1.6;

            stroke-linecap: round;
            stroke-linejoin: round;

            pointer-events: none;
        }

        .show-password {
            position: absolute;

            right: 11px;
            top: 50%;

            transform: translateY(-50%);

            width: 25px;
            height: 25px;

            padding: 3px;

            border: none;

            background: transparent;

            cursor: pointer;
        }

        .show-password svg {
            width: 18px;
            height: 18px;

            fill: none;

            stroke: #7b8290;

            stroke-width: 1.6;

            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .show-password:hover svg {
            stroke: #6338df;
        }


        /* =====================================================
           PASSWORD INFO
        ===================================================== */

        .password-info {
            margin-top: 7px;

            color: #777f8f;

            font-size: 11px;
        }


        /* =====================================================
           PASSWORD STRENGTH
        ===================================================== */

        .strength-container {
            display: none;

            margin-top: 7px;
        }

        .strength-bar {
            width: 100%;
            height: 4px;

            background: #e9e9ee;

            border-radius: 10px;

            overflow: hidden;
        }

        .strength-fill {
            width: 0;
            height: 100%;

            border-radius: 10px;

            transition: 0.25s;
        }

        .strength-text {
            margin-top: 4px;

            font-size: 10px;

            color: #7a8190;
        }


        /* =====================================================
           TERMS
        ===================================================== */

        .terms {
            display: flex;

            align-items: flex-start;

            gap: 9px;

            margin: 20px 0;
        }

        .terms input {
            width: 17px;
            height: 17px;

            margin-top: 1px;

            flex-shrink: 0;

            accent-color: #6338df;

            cursor: pointer;
        }

        .terms label {
            margin: 0;

            color: #707889;

            font-size: 12px;

            font-weight: 400;

            line-height: 1.5;

            cursor: pointer;
        }

        .terms a {
            color: #6338df;

            text-decoration: none;

            font-weight: 700;
        }

        .terms a:hover {
            text-decoration: underline;
        }


        /* =====================================================
           BUTTON
        ===================================================== */

        .register-btn {
            width: 100%;
            height: 46px;

            border: none;
            border-radius: 7px;

            background: #6338df;

            color: white;

            font-size: 14px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.2s;
        }

        .register-btn:hover {
            background: #5230c6;

            transform: translateY(-1px);
        }

        .register-btn:disabled {
            background: #aaa2c7;

            cursor: not-allowed;

            transform: none;
        }


        /* =====================================================
           LOGIN
        ===================================================== */

        .login-text {
            padding-top: 19px;
            margin-top: 19px;

            border-top: 1px solid #eeeeee;

            text-align: center;

            color: #737b8b;

            font-size: 13px;
        }

        .login-text a {
            color: #6338df;

            font-weight: 700;

            text-decoration: none;
        }

        .login-text a:hover {
            text-decoration: underline;
        }


        /* =====================================================
           ERROR / SUCCESS
        ===================================================== */

        .message {
            display: none;

            padding: 11px 13px;

            margin-bottom: 18px;

            border-radius: 7px;

            font-size: 12px;

            line-height: 1.5;
        }

        .message.show {
            display: block;
        }

        .error-message {
            background: #fff1f1;

            border: 1px solid #f0d0d0;

            color: #b63c3c;
        }

        .success-message {
            background: #edf9f2;

            border: 1px solid #ccebd7;

            color: #087a42;
        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 700px) {

            .top-header {
                padding: 0 5%;
            }

            .page {
                padding: 25px 14px 40px;
            }

            .register-card {
                padding: 25px 20px;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 17px;
            }

            .heading h1 {
                font-size: 24px;
            }

        }


        @media (max-width: 450px) {

            .logo-text {
                font-size: 17px;
            }

            .logo-icon {
                width: 41px;
                height: 41px;
            }

            .home-btn span {
                display: none;
            }

            .home-btn {
                width: 40px;
                height: 40px;

                padding: 0;

                justify-content: center;
            }

            .register-card {
                padding: 23px 16px;
            }

        }

    </style>

</head>


<body>


<!-- =========================================================
     HEADER
========================================================= -->

<header class="top-header">


    <!-- LOGO -->

    <a href="index.html" class="logo">

        <div class="logo-icon">

            <!-- Graduation Cap SVG -->

            <svg viewBox="0 0 24 24">

                <path d="M3 9.5 12 5l9 4.5-9 4.5L3 9.5Z"></path>

                <path d="M6 11.2V16c3.5 2.3 8.5 2.3 12 0v-4.8"></path>

                <path d="M21 10v5"></path>

            </svg>

        </div>


        <div class="logo-text">

            Campus<br>

            <span>Marketplace</span>

        </div>

    </a>


    <!-- HOME BUTTON -->

    <a href="index.html" class="home-btn">

        <svg viewBox="0 0 24 24">

            <path d="M3 10.5 12 3l9 7.5"></path>

            <path d="M5 9.5V21h14V9.5"></path>

            <path d="M9.5 21v-6h5v6"></path>

        </svg>

        <span>Back to Home</span>

    </a>

</header>


<!-- =========================================================
     MAIN
========================================================= -->

<main class="page">


    <section class="register-card">


        <!-- =================================================
             HEADING
        ================================================== -->

        <div class="heading">


            <div class="heading-icon">

                <!-- Professional User SVG -->

                <svg viewBox="0 0 24 24">

                    <circle
                        cx="12"
                        cy="8"
                        r="4"
                    ></circle>

                    <path
                        d="M4 21c0-4.2 3.6-7 8-7s8 2.8 8 7"
                    ></path>

                </svg>

            </div>


            <h1>
                Create Your Account
            </h1>


            <p>
                Join your campus community and start buying or selling.
            </p>

        </div>


        <!-- =================================================
             MESSAGES
        ================================================== -->

        <div
            class="message error-message"
            id="errorMessage"
        ></div>


        <div
            class="message success-message"
            id="successMessage"
        ></div>


        <!-- =================================================
             FORM
        ================================================== -->

        <form
            id="registerForm"
            onsubmit="registerUser(event)"
        >


            <!-- =================================================
                 ROW 1
            ================================================== -->

            <div class="form-row">


                <!-- FULL NAME -->

                <div class="form-group">

                    <label for="fullName">

                        Full Name
                        <span class="required">*</span>

                    </label>


                    <div class="input-icon-box">

                        <svg viewBox="0 0 24 24">

                            <circle
                                cx="12"
                                cy="8"
                                r="4"
                            ></circle>

                            <path
                                d="M4 21c0-4.2 3.6-7 8-7s8 2.8 8 7"
                            ></path>

                        </svg>


                        <input
                            type="text"
                            id="fullName"
                            placeholder="Enter your full name"
                            maxlength="60"
                            required
                        >

                    </div>

                </div>


                <!-- STUDENT ID -->

                <div class="form-group">

                    <label for="studentId">

                        Student ID
                        <span class="required">*</span>

                    </label>


                    <div class="input-icon-box">

                        <svg viewBox="0 0 24 24">

                            <rect
                                x="3"
                                y="5"
                                width="18"
                                height="14"
                                rx="2"
                            ></rect>

                            <circle
                                cx="8"
                                cy="10"
                                r="2"
                            ></circle>

                            <path
                                d="M5.5 15c.7-1.5 1.5-2.2 2.5-2.2s1.8.7 2.5 2.2"
                            ></path>

                            <path
                                d="M13 9h5"
                            ></path>

                            <path
                                d="M13 13h5"
                            ></path>

                        </svg>


                        <input
                            type="text"
                            id="studentId"
                            placeholder="e.g. 24CSE1234"
                            maxlength="30"
                            required
                        >

                    </div>

                </div>

            </div>


            <!-- =================================================
                 ROW 2
            ================================================== -->

            <div class="form-row">


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">

                        College Email
                        <span class="required">*</span>

                    </label>


                    <div class="input-icon-box">

                        <svg viewBox="0 0 24 24">

                            <rect
                                x="3"
                                y="5"
                                width="18"
                                height="14"
                                rx="2"
                            ></rect>

                            <path
                                d="m3 7 9 6 9-6"
                            ></path>

                        </svg>


                        <input
                            type="email"
                            id="email"
                            placeholder="yourname@college.edu"
                            required
                        >

                    </div>

                </div>


                <!-- PHONE -->

                <div class="form-group">

                    <label for="phone">

                        Phone Number
                        <span class="required">*</span>

                    </label>


                    <div class="input-icon-box">

                        <svg viewBox="0 0 24 24">

                            <path
                                d="M6.5 3.5 9 3l2 5-2.2 1.8a14 14 0 0 0 5.9 5.9L16.5 14l5 2-.5 2.5c-.3 1.4-1.5 2.4-2.9 2.3C10.7 20.2 3.8 13.3 3.2 5.9 3.1 4.5 5.1 3.8 6.5 3.5Z"
                            ></path>

                        </svg>


                        <input
                            type="tel"
                            id="phone"
                            placeholder="10-digit mobile number"
                            maxlength="10"
                            required
                        >

                    </div>

                </div>

            </div>


            <!-- =================================================
                 ROW 3
            ================================================== -->

            <div class="form-row">


                <!-- DEPARTMENT -->

                <div class="form-group">

                    <label for="department">

                        Department
                        <span class="required">*</span>

                    </label>


                    <select
                        id="department"
                        required
                    >

                        <option value="">
                            Select Department
                        </option>

                        <option value="CSE">
                            CSE
                        </option>

                        <option value="CSIT">
                            CSIT
                        </option>

                        <option value="ECE">
                            ECE
                        </option>

                        <option value="EEE">
                            EEE
                        </option>

                        <option value="ME">
                            ME
                        </option>

                    </select>

                </div>


                <!-- YEAR -->

                <div class="form-group">

                    <label for="year">

                        Year
                        <span class="required">*</span>

                    </label>


                    <select
                        id="year"
                        required
                    >

                        <option value="">
                            Select Year
                        </option>

                        <option value="1st Year">
                            1st Year
                        </option>

                        <option value="2nd Year">
                            2nd Year
                        </option>

                        <option value="3rd Year">
                            3rd Year
                        </option>

                        <option value="4th Year">
                            4th Year
                        </option>

                    </select>

                </div>

            </div>


            <!-- =================================================
                 ROW 4 PASSWORD
            ================================================== -->

            <div class="form-row">


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">

                        Password
                        <span class="required">*</span>

                    </label>


                    <div class="password-box">


                        <!-- Lock -->

                        <svg
                            class="password-lock"
                            viewBox="0 0 24 24"
                        >

                            <rect
                                x="5"
                                y="10"
                                width="14"
                                height="10"
                                rx="2"
                            ></rect>

                            <path
                                d="M8 10V7a4 4 0 0 1 8 0v3"
                            ></path>

                        </svg>


                        <input
                            type="password"
                            id="password"
                            placeholder="Create a password"
                            minlength="8"
                            required
                        >


                        <!-- Show Password -->

                        <button
                            type="button"
                            class="show-password"
                            onclick="togglePassword('password', this)"
                            aria-label="Show password"
                        >

                            <svg viewBox="0 0 24 24">

                                <path
                                    d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"
                                ></path>

                                <circle
                                    cx="12"
                                    cy="12"
                                    r="2.5"
                                ></circle>

                            </svg>

                        </button>

                    </div>


                    <div
                        class="password-info"
                        id="passwordInfo"
                    >
                        At least 8 characters with uppercase, number and special character.
                    </div>


                    <div
                        class="strength-container"
                        id="strengthContainer"
                    >

                        <div class="strength-bar">

                            <div
                                class="strength-fill"
                                id="strengthFill"
                            ></div>

                        </div>


                        <div
                            class="strength-text"
                            id="strengthText"
                        ></div>

                    </div>

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label for="confirmPassword">

                        Confirm Password
                        <span class="required">*</span>

                    </label>


                    <div class="password-box">


                        <!-- Lock -->

                        <svg
                            class="password-lock"
                            viewBox="0 0 24 24"
                        >

                            <rect
                                x="5"
                                y="10"
                                width="14"
                                height="10"
                                rx="2"
                            ></rect>

                            <path
                                d="M8 10V7a4 4 0 0 1 8 0v3"
                            ></path>

                        </svg>


                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Re-enter your password"
                            required
                        >


                        <!-- Show Password -->

                        <button
                            type="button"
                            class="show-password"
                            onclick="togglePassword('confirmPassword', this)"
                            aria-label="Show password"
                        >

                            <svg viewBox="0 0 24 24">

                                <path
                                    d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"
                                ></path>

                                <circle
                                    cx="12"
                                    cy="12"
                                    r="2.5"
                                ></circle>

                            </svg>

                        </button>

                    </div>

                </div>

            </div>


            <!-- =================================================
                 TERMS
            ================================================== -->

            <div class="terms">

                <input
                    type="checkbox"
                    id="terms"
                    required
                >


                <label for="terms">

                    I agree to the

                    <a href="#">
                        Terms & Conditions
                    </a>

                    and

                    <a href="#">
                        Privacy Policy
                    </a>

                    of Campus Marketplace.

                </label>

            </div>


            <!-- =================================================
                 REGISTER BUTTON
            ================================================== -->

            <button
                type="submit"
                class="register-btn"
                id="registerButton"
            >
                Create Account
            </button>

        </form>


        <!-- =================================================
             LOGIN
        ================================================== -->

        <div class="login-text">

            Already have an account?

            <a href="login.html">
                Login here
            </a>

        </div>

    </section>

</main>


<!-- =========================================================
     JAVASCRIPT
========================================================= -->

<script>


    /* =====================================================
       TOGGLE PASSWORD
    ===================================================== */

    function togglePassword(inputId, button) {

        const input =
            document.getElementById(inputId);


        if (input.type === "password") {

            input.type = "text";


            button.innerHTML = `

                <svg viewBox="0 0 24 24">

                    <path d="M3 3l18 18"></path>

                    <path
                        d="M10.6 10.6a2.5 2.5 0 0 0 3.5 3.5"
                    ></path>

                    <path
                        d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-3.1 3.9"
                    ></path>

                    <path
                        d="M6.1 6.1C3.4 8.1 2 12 2 12s3.5 7 10 7c1.8 0 3.4-.5 4.8-1.2"
                    ></path>

                </svg>

            `;

        } else {

            input.type = "password";


            button.innerHTML = `

                <svg viewBox="0 0 24 24">

                    <path
                        d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"
                    ></path>

                    <circle
                        cx="12"
                        cy="12"
                        r="2.5"
                    ></circle>

                </svg>

            `;

        }

    }


    /* =====================================================
       PASSWORD STRENGTH
    ===================================================== */

    const password =
        document.getElementById("password");


    password.addEventListener(
        "input",
        checkPassword
    );


    function checkPassword() {

        const value = password.value;


        const length =
            value.length >= 8;


        const uppercase =
            /[A-Z]/.test(value);


        const number =
            /[0-9]/.test(value);


        const special =
            /[^A-Za-z0-9]/.test(value);


        const score =
            [
                length,
                uppercase,
                number,
                special
            ].filter(Boolean).length;


        const container =
            document.getElementById(
                "strengthContainer"
            );


        const fill =
            document.getElementById(
                "strengthFill"
            );


        const text =
            document.getElementById(
                "strengthText"
            );


        if (value.length === 0) {

            container.style.display =
                "none";

            return;

        }


        container.style.display =
            "block";


        if (score === 1) {

            fill.style.width = "25%";

            fill.style.background =
                "#d9534f";

            text.textContent =
                "Weak password";

        }

        else if (score === 2) {

            fill.style.width = "50%";

            fill.style.background =
                "#e4a72c";

            text.textContent =
                "Fair password";

        }

        else if (score === 3) {

            fill.style.width = "75%";

            fill.style.background =
                "#6c63d9";

            text.textContent =
                "Good password";

        }

        else {

            fill.style.width = "100%";

            fill.style.background =
                "#078143";

            text.textContent =
                "Strong password";

        }

    }


    /* =====================================================
       REGISTER USER
    ===================================================== */

    function registerUser(event) {

        event.preventDefault();


        const error =
            document.getElementById(
                "errorMessage"
            );


        const success =
            document.getElementById(
                "successMessage"
            );


        error.classList.remove("show");

        success.classList.remove("show");


        /* GET VALUES */

        const fullName =
            document.getElementById(
                "fullName"
            ).value.trim();


        const studentId =
            document.getElementById(
                "studentId"
            ).value.trim();


        const email =
            document.getElementById(
                "email"
            ).value.trim();


        const phone =
            document.getElementById(
                "phone"
            ).value.trim();


        const department =
            document.getElementById(
                "department"
            ).value;


        const year =
            document.getElementById(
                "year"
            ).value;


        const passwordValue =
            document.getElementById(
                "password"
            ).value;


        const confirmPassword =
            document.getElementById(
                "confirmPassword"
            ).value;


        const terms =
            document.getElementById(
                "terms"
            ).checked;


        /* =================================================
           VALIDATION
        ================================================= */


        if (fullName.length < 2) {

            showError(
                "Please enter your full name."
            );

            return;

        }


        if (studentId.length < 3) {

            showError(
                "Please enter a valid Student ID."
            );

            return;

        }


        const emailPattern =
            /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


        if (!emailPattern.test(email)) {

            showError(
                "Please enter a valid college email address."
            );

            return;

        }


        if (!/^[0-9]{10}$/.test(phone)) {

            showError(
                "Please enter a valid 10-digit phone number."
            );

            return;

        }


        if (!department) {

            showError(
                "Please select your department."
            );

            return;

        }


        if (!year) {

            showError(
                "Please select your year."
            );

            return;

        }


        if (passwordValue.length < 8) {

            showError(
                "Password must contain at least 8 characters."
            );

            return;

        }


        if (!/[A-Z]/.test(passwordValue)) {

            showError(
                "Password must contain at least one uppercase letter."
            );

            return;

        }


        if (!/[0-9]/.test(passwordValue)) {

            showError(
                "Password must contain at least one number."
            );

            return;

        }


        if (!/[^A-Za-z0-9]/.test(passwordValue)) {

            showError(
                "Password must contain at least one special character."
            );

            return;

        }


        if (passwordValue !== confirmPassword) {

            showError(
                "Passwords do not match."
            );

            return;

        }


        if (!terms) {

            showError(
                "Please accept the Terms & Conditions."
            );

            return;

        }


        /* =================================================
           CHECK EXISTING USER
        ================================================= */

        const existingUser =
            JSON.parse(
                localStorage.getItem(
                    "campusUser"
                )
            );


        if (
            existingUser &&
            existingUser.email === email
        ) {

            showError(
                "An account with this email already exists."
            );

            return;

        }


        /* =================================================
           SAVE USER
           
           NOTE:
           This is for frontend testing only.
           Passwords should NOT be stored this way
           in a real production application.
        ================================================= */

        const user = {

            fullName:
                fullName,

            studentId:
                studentId,

            email:
                email,

            phone:
                phone,

            department:
                department,

            year:
                year,

            registeredAt:
                new Date().toISOString()

        };


        localStorage.setItem(
            "campusUser",
            JSON.stringify(user)
        );


        /* =================================================
           SUCCESS
        ================================================= */

        success.textContent =
            "Account created successfully! Redirecting to login...";


        success.classList.add("show");


        document.getElementById(
            "registerButton"
        ).disabled = true;


        setTimeout(
            function() {

                window.location.href =
                    "login.html";

            },
            1500
        );

    }


    /* =====================================================
       SHOW ERROR
    ===================================================== */

    function showError(message) {

        const error =
            document.getElementById(
                "errorMessage"
            );


        error.textContent =
            message;


        error.classList.add("show");


        window.scrollTo({

            top: 0,

            behavior: "smooth"

        });

    }


    /* =====================================================
       PHONE VALIDATION
    ===================================================== */

    document
        .getElementById("phone")
        .addEventListener(
            "input",
            function() {

                this.value =
                    this.value.replace(
                        /[^0-9]/g,
                        ""
                    );

            }
        );


    /* =====================================================
       STUDENT ID
    ===================================================== */

    document
        .getElementById("studentId")
        .addEventListener(
            "input",
            function() {

                this.value =
                    this.value
                        .toUpperCase()
                        .replace(
                            /\s/g,
                            ""
                        );

            }
        );


</script>
